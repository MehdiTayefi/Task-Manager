{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Taskly — Make room for what matters{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'frontend/css/app.css' %}?v=2">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <header class="site-header">
        <a class="brand" href="{% url 'frontend:home' %}" aria-label="Taskly home"><span class="brand-mark" aria-hidden="true">✓</span>taskly<span class="brand-dot">.</span></a>
        <span class="header-note"><span class="status-dot" aria-hidden="true"></span>A little more focus. A lot more done.</span>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    <footer class="site-footer"><span>© {% now "Y" %} Taskly</span><span>One task at a time.</span></footer>
    {% block scripts %}{% endblock %}
</body>
</html>
